experiment:
  name: vjepa21_vitt16_visible_final_h100
  output_dir: results/h100/ablation/B/pretrain/seed_42
  seed: 42
data:
  lmdb_path: ${WORLDFLOODS_LMDB_DIR}/worldfloods_train.lmdb
  crop_size: 256
  input_bands:
  - B2
  - B3
  - B4
  - B5
  - B6
  - B7
  - B8
  - B8A
  - B11
  - B12
  normalization: worldfloods
  augment_d4: true
  minimum_nonpadding_fraction: 0.25
  sample_retry_attempts: 20
model:
  model_name: vit_tiny
  input_channels: 10
  patch_size: 16
  encoder_dim: 192
  predictor_depth: 4
  predictor_dim: 192
  predictor_heads: 6
  deep_self_supervision_levels: 1
  use_rope: true
  use_sdpa: true
  uniform_power: true
  use_activation_checkpointing: false
  modality_embedding: false
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 10
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
loss:
  exponent: 1.0
  predict_all: true
  distance_weighted_context: true
  context_weight: 0.5
  context_warmup_start_fraction: 0.05
  context_warmup_end_fraction: 0.1
  sigreg:
    enabled: false
    weight: 0.05
    num_projections: 256
    num_knots: 17
    t_max: 3.0
    projector_hidden_dim: 512
    projector_output_dim: 128
    seed: 42
optimization:
  epochs: 100
  per_device_batch_size: 32
  num_workers: 8
  learning_rate: 0.0002
  start_learning_rate: 1.0e-06
  final_learning_rate: 1.0e-06
  weight_decay: 0.04
  final_weight_decay: 0.4
  warmup_epochs: 10
  ema_start: 0.99925
  ema_end: 0.99925
  gradient_clip_norm: 1.0
  dtype: bfloat16
  pin_memory: true
  persistent_workers: true
  max_steps_per_epoch: null
checkpoint:
  save_every_epochs: 10
  resume: null
