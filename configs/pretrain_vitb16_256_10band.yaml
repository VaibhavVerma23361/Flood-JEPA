experiment:
  name: vjepa21_vitb16_worldfloods_10band_256
  output_dir: results/vjepa21_vitb16_worldfloods_10band_256/seed_42
  seed: 42

data:
  # The value is expanded with os.path.expandvars at runtime.
  lmdb_path: ${WORLDFLOODS_LMDB_DIR}/worldfloods_train.lmdb
  crop_size: 256
  input_bands: [B2, B3, B4, B5, B6, B7, B8, B8A, B11, B12]
  normalization: worldfloods
  augment_d4: true
  minimum_nonpadding_fraction: 0.25
  sample_retry_attempts: 20

model:
  # V-JEPA 2.1 ViT-B/16 encoder; only in_chans differs from the RGB model.
  model_name: vit_base
  input_channels: 10
  patch_size: 16
  encoder_dim: 768
  predictor_depth: 12
  predictor_dim: 384
  predictor_heads: 12
  deep_self_supervision_levels: 4
  use_rope: true
  use_sdpa: true
  uniform_power: true
  use_activation_checkpointing: true
  modality_embedding: false

mask:
  # Matches the official V-JEPA 2.1 image-mask recipe.
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 10
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]

loss:
  exponent: 1.0
  predict_all: true
  distance_weighted_context: true
  context_weight: 0.5
  context_warmup_start_fraction: 0.05
  context_warmup_end_fraction: 0.10
  # Disabled for the original V-JEPA 2.1 baseline. Use the dedicated SIGReg
  # config/launcher for the regularized experiment.
  sigreg:
    enabled: false
    weight: 0.05
    num_projections: 256
    num_knots: 17
    t_max: 3.0
    projector_hidden_dim: 2048
    projector_output_dim: 128
    seed: 42

optimization:
  epochs: 100
  per_device_batch_size: 16
  num_workers: 8
  learning_rate: 0.0002
  start_learning_rate: 0.000001
  final_learning_rate: 0.000001
  weight_decay: 0.04
  final_weight_decay: 0.4
  warmup_epochs: 10
  ema_start: 0.99925
  ema_end: 0.99925
  gradient_clip_norm: 1.0
  dtype: float16
  pin_memory: true
  persistent_workers: true
  max_steps_per_epoch: null

checkpoint:
  save_every_epochs: 10
  resume: null
