experiment:
  name: vjepa21_vitb16_worldfloods_4band_256
  output_dir: results/vjepa21_vitb16_worldfloods_4band_256/seed_42
  seed: 42

data:
  # Common Sentinel-2/PlanetScope channels, ordered blue, green, red, NIR.
  # The value is expanded with os.path.expandvars at runtime.
  lmdb_path: ${WORLDFLOODS_LMDB_DIR}/worldfloods_train.lmdb
  crop_size: 256
  input_bands: [B2, B3, B4, B8]
  normalization: worldfloods
  augment_d4: true
  minimum_nonpadding_fraction: 0.25

model:
  # V-JEPA 2.1 ViT-B/16; only the patch projection's in_chans changes from RGB.
  model_name: vit_base
  input_channels: 4
  patch_size: 16
  encoder_dim: 768
  predictor_depth: 12
  predictor_dim: 384
  predictor_heads: 12
  deep_self_supervision_levels: 4
  use_rope: true
  use_sdpa: true
  uniform_power: true
  use_activation_checkpointing: true
  modality_embedding: false

mask:
  # Official V-JEPA 2.1 image-mask recipe.
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 10
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]

loss:
  exponent: 1.0
  predict_all: true
  distance_weighted_context: true
  context_weight: 0.5
  context_warmup_start_fraction: 0.05
  context_warmup_end_fraction: 0.10

optimization:
  epochs: 100
  per_device_batch_size: 16
  num_workers: 8
  learning_rate: 0.0002
  start_learning_rate: 0.000001
  final_learning_rate: 0.000001
  weight_decay: 0.04
  final_weight_decay: 0.4
  warmup_epochs: 10
  ema_start: 0.99925
  ema_end: 0.99925
  gradient_clip_norm: 1.0
  dtype: float16
  pin_memory: true
  persistent_workers: true

checkpoint:
  save_every_epochs: 10
  resume: null
